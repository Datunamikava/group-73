<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid and functions</title>


<style>
.cont{
 display: grid;
 grid-template-rows:(5grid,100px) ;
 grid-template-rows:(5grid,100px) ;
 /* grid-template-areas: ; */

 
 

}

p1{
    background-color: blue;
    grid-template-areas: p1;
}



p2{
    background-color: rgb(9, 9, 68);
    grid-template-areas: p2;
}



p3{
    background-color: rgb(51, 168, 15);
    grid-template-areas: p3;
}

p4{
    background-color: rgb(0, 255, 221);
    grid-template-areas: p4;
}


p5{
    background-color: rgb(227, 39, 39);
    grid-template-areas: p5;
}


p6{
    background-color: rgb(162, 137, 142);
    grid-template-areas: p6;
}



p7{
    background-color: rgb(214, 214, 214);
    grid-template-areas: p7;
}



p8{
    background-color: rgb(255, 121, 231);
    grid-template-areas: p8;
}




    
</style>





</head>
<body>
    <div class="cont">
        <p class="p1"></p>
        <p class="p2"></p>
        <p class="p3"></p>
        <p class="p5"></p>
        <p class="p6"></p>
        <p class="p7"></p>
        <p class="p8"></p>
    </div>






</body>
</html>
